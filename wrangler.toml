name = "theforktreeprojectdotcom"
workers_dev = true
main = "./dist/_worker.js/index.js"
compatibility_date = "2026-02-24"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "theforktreeproject.com", custom_domain = true },
  { pattern = "www.theforktreeproject.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "forktree_pageviews"

[ai]
binding = "AI"

# Wrangler provisions this D1 database automatically on dev/deploy.
[[d1_databases]]
binding = "VOLUNTEER_SIGN_INS"
migrations_dir = "migrations"

[[vectorize]]
binding = "JOURNAL_VECTORIZE"
index_name = "forktree-journal"

[triggers]
# 17 3: journal search reindex. 30 6,7: volunteer 5pm Adelaide auto sign-out (covers ACDT and ACST).
crons = ["17 3 * * *", "30 6,7 * * *"]

[observability]
enabled = true
