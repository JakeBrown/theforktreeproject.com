name = "theforktreeprojectdotcom"
workers_dev = true
main = "./dist/_worker.js/index.js"
compatibility_date = "2026-02-24"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "theforktreeproject.com", custom_domain = true },
  { pattern = "www.theforktreeproject.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare Access protects /admin ("Forktree Project Admin" app in the Windy Bit Zero Trust org).
# The Worker also verifies the Access JWT against these, and refuses /admin if they are missing.
[vars]
CF_ACCESS_TEAM_DOMAIN = "windybit.cloudflareaccess.com"
CF_ACCESS_AUD = "af86c6e509114e047cfce88cde840f10695f5792e6b402d8f4962ed461a53889"
# MailerLite "Volunteers" group that registrations sync into. The API key is the
# MAILERLITE_API_KEY secret (wrangler secret put), never in this file.
MAILERLITE_VOLUNTEERS_GROUP_ID = "204968455775978608"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "forktree_pageviews"

[ai]
binding = "AI"

# Wrangler provisions this D1 database automatically on dev/deploy.
[[d1_databases]]
binding = "VOLUNTEER_SIGN_INS"
migrations_dir = "migrations"

[[vectorize]]
binding = "JOURNAL_VECTORIZE"
index_name = "forktree-journal"

[triggers]
# 17 3: journal search reindex. 30 6,7: volunteer 5pm Adelaide auto sign-out (covers ACDT and ACST).
crons = ["17 3 * * *", "30 6,7 * * *"]

[observability]
enabled = true
